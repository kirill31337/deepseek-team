name: Release verification
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve candidate version
        id: package
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Build and verify current package lifecycle
        run: |
          python -m pip install build twine pipx uv
          python -m build
          python -m twine check --strict dist/*
          for installer in pip pipx uv; do
            python scripts/check_installation.py --installer "$installer" --wheel dist/*.whl
          done
      - name: Verify installed coordinator hooks and preserve external state
        run: |
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          spec = importlib.util.spec_from_file_location('installation_check', 'scripts/check_installation.py')
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)
          wheel, = Path('dist').resolve().glob('*.whl')
          _, version = checker.wheel_identity(wheel)
          with tempfile.TemporaryDirectory(prefix='deepseek-team-hooks-') as temporary:
              root = Path(temporary)
              env = checker.isolated_environment(root)
              Path(env['TMPDIR']).mkdir(parents=True)
              sentinels = checker.create_sentinels(root, env)
              project = root / 'project'
              installer = checker.Installer('pip', checker.manager_executable('pip'), root, env, project)
              env['PATH'] = str(installer.bin_dir) + os.pathsep + env.get('PATH', '')
              installer.install(wheel, replacement=False)
              checker.verify_install(installer, version)
              checker.assert_sentinels(sentinels, 'install')
              team = str(installer.bin_dir / 'deepseek-team')
              def run(*args, payload=None):
                  result = subprocess.run(args, env=env, cwd=project, text=True,
                                          input=json.dumps(payload) if payload is not None else None,
                                          capture_output=True, check=False)
                  if result.returncode:
                      raise SystemExit(f'Installed command failed: {args[1:]}\n{result.stderr or result.stdout}')
                  return result.stdout
              run('git', 'init', '-q', str(project))
              run('git', '-c', 'user.name=Fixture', '-c', 'user.email=fixture@example.invalid',
                  'commit', '--allow-empty', '-qm', 'fixture')
              run(team, 'hooks', 'install', '--runtime', 'both')
              run(team, 'hooks', 'status', '--runtime', 'both')
              run(team, 'init', '--coordinator', 'both', str(project))
              run(team, 'auth', 'status')
              for runtime in ('codex', 'claude'):
                  payload = dict(session_id='installed-' + runtime, turn_id='turn-1',
                                 cwd=str(project), hook_event_name='UserPromptSubmit',
                                 prompt='Implement fixture', permission_mode='default')
                  output = run(team, 'coordinator-hook', '--runtime', runtime, payload=payload)
                  assert 'coordination task task-' in output, output
                  payload.update(hook_event_name='PreToolUse', tool_name='Write',
                                 tool_input={'file_path': str(project / 'a.py')})
                  output = json.loads(run(team, 'coordinator-hook', '--runtime', runtime, payload=payload))
                  assert output['hookSpecificOutput']['permissionDecision'] == 'deny', output
                  payload.update(tool_name='spawn_agent' if runtime == 'codex' else 'Agent',
                                 tool_input={'prompt': 'Inspect Git history independently'})
                  output = json.loads(run(team, 'coordinator-hook', '--runtime', runtime, payload=payload))
                  assert output['hookSpecificOutput']['permissionDecision'] == 'deny', output
                  assert 'native delegation gate' in output['hookSpecificOutput']['permissionDecisionReason'], output
              preserved = dict(sentinels)
              preserved[project / 'CLAUDE.md'] = b''
              for directory in (Path(env['HOME']), Path(env['CODEX_HOME']),
                                Path(env['CLAUDE_CONFIG_DIR'])):
                  preserved.update({path: b'' for path in directory.rglob('*') if path.is_file()})
              preserved = {path: path.read_bytes() for path in preserved}
              installer.install(wheel, replacement=True)
              checker.verify_install(installer, version)
              checker.assert_sentinels(preserved, 'replacement')
              run(team, 'hooks', 'status', '--runtime', 'both')
              run(team, 'auth', 'status')
              installer.uninstall()
              assert not installer.commands[0].exists()
              checker.assert_sentinels(preserved, 'uninstall')
          print('PASS: installed native hook protocol and external-state preservation')
          PY
      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-team-${{ steps.package.outputs.version }}-dist
          path: dist/*
