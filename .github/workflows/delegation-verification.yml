name: Delegation verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  real-permissions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install tested runtimes and OS isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor
          npm install -g @openai/codex@0.155.1 @anthropic-ai/claude-code@2.1.278
          python -m pip install .
          deepseek-team sandbox install-apparmor
          deepseek-team sandbox status
          codex --version
          claude --version
      - name: Enforce real OS and runtime checks without paid APIs
        env:
          DEEPSEEK_TEAM_REQUIRE_LIVE: '1'
          PYTHONPATH: src
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_live_delegation.py -v 2>&1 | tee live-verification.log
          python -m unittest discover -s tests -p test_runtime_environment.py -v 2>&1 | tee -a live-verification.log
          python -m unittest discover -s tests -p test_claude_coordination_integration.py -v 2>&1 | tee -a live-verification.log
          python -m unittest discover -s tests -p test_codex_coordination_integration.py -v 2>&1 | tee -a live-verification.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-delegation-verification
          path: live-verification.log
