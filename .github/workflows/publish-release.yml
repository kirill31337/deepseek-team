name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'Registry (PyPI requires a matching version tag and enabled publishing)'
        type: choice
        options: [testpypi, pypi]
        default: testpypi
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'kirill31337/deepseek-team'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate release identity
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['RELEASE_REF']
          if ref.startswith('refs/tags/') or os.environ['RELEASE_TARGET'] == 'pypi':
              if ref != f'refs/tags/v{version}':
                  raise SystemExit('Production releases require the tag v' + version)
          if not Path(f'docs/releases/{version}.md').is_file():
              raise SystemExit('Missing release notes for ' + version)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - name: Test and build distributions
        run: |
          python -m pip install build twine pipx uv
          PYTHONPATH=src python3 -m unittest discover -s tests -v
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the exact wheel with each installer
        run: |
          for installer in pip pipx uv; do
            python3 scripts/check_installation.py --installer "$installer" --wheel dist/*.whl
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            docs/releases/${{ steps.version.outputs.version }}.md
          if-no-files-found: error

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || inputs.target == 'pypi')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists; preserving its assets."
          else
            gh release create "v$VERSION" dist/* --verify-tag \
              --title "DeepSeek Team $VERSION" --notes-file "docs/releases/$VERSION.md"
          fi

  pypi:
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || inputs.target == 'pypi') &&
      vars.PYPI_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/codex-deepseek-team
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
      - name: Publish verified distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/codex-deepseek-team
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ github.sha }}
      - name: Publish verified distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
