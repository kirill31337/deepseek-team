[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-deepseek-team"
version = "0.6.0"
description = "Delegate bounded coding tasks from Codex and/or Claude Code to isolated DeepSeek workers."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kirill31337"}]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/kirill31337/deepseek-team"
Issues = "https://github.com/kirill31337/deepseek-team/issues"

[project.scripts]
codex-deepseek-team = "codex_deepseek_team.cli:main"
deepseek-team = "codex_deepseek_team.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_deepseek_team = ["data/*.md", "data/apparmor/*"]
